name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"

      - name: Test blog section
        run: npm run test:blog

      - name: Extract blog posts for KV
        run: node scripts/extract-blog-posts.mjs

      - name: Test KV bundle
        run: npm run test:kv

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 pages deploy dist \
            --project-name "ecudocs-com" \
            --branch "main" \
            --commit-hash "${{ github.sha }}" \
            --commit-message "$(git log -1 --pretty=%s)"

      - name: Prepare KV namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          NS_ID=$(curl -sf -H "$AUTH" "$API?per_page=100" | jq -r '.result[] | select(.title=="ecudocs-com-BLOG_KV") | .id' | head -1)
          if [ -z "$NS_ID" ]; then
            NS_ID=$(curl -sf -X POST -H "$AUTH" -H 'Content-Type: application/json' \
              -d '{"title":"ecudocs-com-BLOG_KV"}' "$API" | jq -r '.result.id')
          fi
          test -n "$NS_ID"
          echo "namespace: $NS_ID"
          NS_ID="$NS_ID" node -e "const fs=require('fs');const p='wrangler.worker.jsonc';fs.writeFileSync(p,fs.readFileSync(p,'utf8').replace('BLOG_KV_NAMESPACE_ID',process.env.NS_ID))"

      - name: Upload blog posts to KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          NS_ID=$(node -e "console.log(JSON.parse(require('fs').readFileSync('wrangler.worker.jsonc','utf8')).kv_namespaces[0].id)")
          for f in kv-bulk/chunk-*.json; do
            echo "uploading $f"
            npx wrangler@4 kv bulk put --remote --namespace-id "$NS_ID" "$f"
          done

      - name: Deploy Worker (serves ecudocs.com)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy --config wrangler.worker.jsonc
